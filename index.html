*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.hdr{text-align:center;padding:1.5rem 1rem;background:linear-gradient(180deg,#0f172a,#162032);border-bottom:2px solid var(--border)}

.hdr p{font-size:1rem;color:var(--muted)}
.wrap{max-width:1640px;margin:0 auto;padding:1.5rem}

/* Nuevo contenedor para garantizar tamaños legibles en móviles/laptops */
.svg-container {
  width: 100%;
  overflow-x: auto;
  background: var(--bg);
  border-radius: 10px;
  border: 1px solid var(--border);
}
svg{min-width:1400px;width:100%;height:auto;display:block;background:var(--bg)}

.legend{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin:1rem 0 1.5rem;padding:1.2rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:.4rem;font-size:.9rem}
.ldot{width:14px;height:14px;border-radius:50%}
.ldia{width:14px;height:14px;transform:rotate(45deg);border-radius:2px}
.notes{padding:1.5rem;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-top:1.5rem;font-size:.95rem;color:var(--muted)}
.notes strong{color:#e2e8f0}
.dev:hover rect,.dev:hover circle,.dev:hover polygon{filter:brightness(1.4);cursor:pointer}
.dev:hover .dtip{opacity:1}
.dtip{opacity:0;transition:opacity .2s;pointer-events:none}
@media(max-width:900px){.hdr h1{font-size:1.4rem}.wrap{padding:.8rem}}
</style>

function el(tag,attrs,children){
  const e=document.createElementNS(NS,tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(children) (Array.isArray(children)?children:[children]).forEach(c=>e.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return e;
}

function getRoom(id){return rooms.find(r=>r.id===id);}

function getDevPos(devList,room,idx){
  const perRow = Math.floor((room.w - 40) / 120); 
  const col = idx % perRow;
  const row = Math.floor(idx / perRow);
  return { x: room.x + 60 + col * 120, y: room.y + 65 + row * 85 };
}

function getPRPos(prList,room,idx,totalDevs){
  const perRow = Math.floor((room.w - 40) / 90);
  const devRows = Math.ceil(totalDevs / Math.floor((room.w - 40) / 120));
  const startY = room.y + 65 + devRows * 85 + 20;
  const col = idx % perRow;
  const row = Math.floor(idx / perRow);
  return { x: room.x + 50 + col * 90, y: startY + row * 45 };
}

function getSwitchCenter(switchId){
  const d=devices.find(d=>d.id===switchId);
  if(!d)return null;
  const r=getRoom(d.room);
  const devsInRoom=devices.filter(dd=>dd.room===d.room);
  const idx=devsInRoom.indexOf(d);
  return getDevPos(devsInRoom,r,idx);
}

function render(){

  svg.innerHTML='';

  const defs=el('defs');
  const glow=el('filter',{id:'glow',x:'-20%',y:'-20%',width:'140%',height:'140%'});
  glow.appendChild(el('feGaussianBlur',{stdDeviation:'3',result:'blur'}));
  glow.appendChild(el('feMerge',{},[el('feMergeNode',{in:'blur'}),el('feMergeNode',{in:'SourceGraphic'})]));
  defs.appendChild(glow);
  svg.appendChild(defs);

  for(let gx=0;gx<=1840;gx+=40){
    svg.appendChild(el('line',{x1:gx,y1:0,x2:gx,y2:1600,stroke:'#141e2e','stroke-width':.6}));
  }
  for(let gy=0;gy<=1600;gy+=40){
    svg.appendChild(el('line',{x1:0,y1:gy,x2:1840,y2:gy,stroke:'#141e2e','stroke-width':.6}));
  }

  rooms.forEach(r=>{
    const vc=VCOL[r.vlan]||VCOL[0];
    const g=el('g',{class:'room'});
    g.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:8,fill:'#141e2e',stroke:vc,'stroke-width':3,opacity:.92}));
    g.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:38,rx:8,fill:vc,opacity:.18}));
    g.appendChild(el('text',{x:r.x+16,y:r.y+26,fill:vc,'font-size':18,'font-weight':700},r.name));
    
    if(r.vlan>0){
      g.appendChild(el('text',{x:r.x+r.w-12,y:r.y+26,fill:vc,'font-size':15,opacity:.7,'text-anchor':'end'},'VLAN '+r.vlan));
    } else {
      g.appendChild(el('text',{x:r.x+r.w-12,y:r.y+26,fill:vc,'font-size':15,opacity:.7,'text-anchor':'end'},'INFRA'));
    }
    svg.appendChild(g);
  });

  prPoints.forEach(pr=>{
    const r=getRoom(pr.room);
    if(!r)return;
    const devsInRoom=devices.filter(d=>d.room===pr.room);
    const prIdx=prPoints.filter(p=>p.room===pr.room).indexOf(pr);
    const pos=getPRPos(prPoints.filter(p=>p.room===pr.room),r,prIdx,devsInRoom.length);
    const swPos=getSwitchCenter(pr.sw);
    if(!swPos)return;
    const cableCol=pr.cable==='Fibra óptica'?'#f59e0b':'#38bdf8';
    const dash=pr.cable==='Fibra óptica'?'10,6':'6,4';
    const opacity=pr.status==='mantenimiento'?.3:.5;
    const mx=(pos.x+swPos.x)/2;
    const my=Math.min(pos.y,swPos.y)-40;
    const path=`M${pos.x},${pos.y} Q${mx},${my} ${swPos.x},${swPos.y}`;
    svg.appendChild(el('path',{d:path,stroke:cableCol,'stroke-width':2.5,fill:'none','stroke-dasharray':dash,opacity:opacity}));
  });

  const roomDevMap={};
  devices.forEach(d=>{if(!roomDevMap[d.room])roomDevMap[d.room]=[];roomDevMap[d.room].push(d);});

  Object.entries(roomDevMap).forEach(([roomId,devs])=>{
    const r=getRoom(roomId);
    if(!r)return;
    devs.forEach((d,idx)=>{
      const pos=getDevPos(devs,r,idx);
      const vc=VCOL[d.vlan]||VCOL[0];
      const sc=STAT_COL[d.status]||STAT_COL.operativo;
      const g=el('g',{class:'dev'});
      
      let shape;
      if(d.type==='CM'){
        shape=el('polygon',{points:`${pos.x},${pos.y-18} ${pos.x-16},${pos.y+12} ${pos.x+16},${pos.y+12}`,fill:vc,stroke:sc,'stroke-width':2});
      } else if(d.type==='AP'){
        shape=el('circle',{cx:pos.x,cy:pos.y,r:16,fill:vc,stroke:sc,'stroke-width':2});
        g.appendChild(el('circle',{cx:pos.x,cy:pos.y,r:26,fill:'none',stroke:vc,'stroke-width':1.5,opacity:.3,'stroke-dasharray':'4,4'}));
      } else if(d.type==='SW'){
        shape=el('rect',{x:pos.x-28,y:pos.y-12,width:56,height:24,rx:4,fill:vc,stroke:sc,'stroke-width':2});
      } else if(d.type==='SV'){
        shape=el('rect',{x:pos.x-14,y:pos.y-22,width:28,height:44,rx:3,fill:vc,stroke:sc,'stroke-width':2});
      } else if(d.type==='RT'){
        shape=el('polygon',{points:`${pos.x-11},${pos.y-18} ${pos.x+11},${pos.y-18} ${pos.x+20},${pos.y-5} ${pos.x+20},${pos.y+5} ${pos.x+11},${pos.y+18} ${pos.x-11},${pos.y+18} ${pos.x-20},${pos.y+5} ${pos.x-20},${pos.y-5}`,fill:vc,stroke:sc,'stroke-width':2});
      } else if(d.type==='PR'||d.type==='PJ'){
        shape=el('rect',{x:pos.x-18,y:pos.y-12,width:36,height:24,rx:3,fill:vc,stroke:sc,'stroke-width':2});
      } else if(d.type==='CA'){
        shape=el('polygon',{points:`${pos.x},${pos.y-20} ${pos.x+18},${pos.y-9} ${pos.x+14},${pos.y+9} ${pos.x},${pos.y+20} ${pos.x-14},${pos.y+9} ${pos.x-18},${pos.y-9}`,fill:vc,stroke:sc,'stroke-width':2});
      } else {
        shape=el('circle',{cx:pos.x,cy:pos.y,r:16,fill:vc,stroke:sc,'stroke-width':2});
      }
      
      if(d.status!=='operativo'){
        shape.setAttribute('stroke-dasharray','4,3');
        if(d.status==='fuera'){
          shape.setAttribute('opacity','.45');
        }
      }
      g.appendChild(shape);
      
      const typeLabels={RT:'FW',SW:'SW',AP:'AP',SV:'SRV',CM:'CAM',PR:'IMP',PC:'PC',NB:'NB',OT:'OT',CA:'ACC',PJ:'PRJ'};
      g.appendChild(el('text',{x:pos.x,y:pos.y+4,'text-anchor':'middle',fill:'#fff','font-size':11,'font-weight':700},typeLabels[d.type]||'?'));
      
      const lbl=d.id.length>14?d.id.substring(0,14):d.id;
      const txtEl=el('text',{x:pos.x,y:pos.y+34,'text-anchor':'middle',fill:vc,'font-size':12,'font-weight':700},lbl);
      if(d.status==='fuera'){txtEl.setAttribute('text-decoration','line-through');txtEl.setAttribute('opacity','.5');}
      g.appendChild(txtEl);
      
      if(d.ip){
        g.appendChild(el('text',{x:pos.x,y:pos.y+48,'text-anchor':'middle',fill:'#86efac','font-size':11,'font-family':'monospace'},d.ip));
      }
      
      const tipLines=[`${d.id} | ${d.model}`,`VLAN ${d.vlan} (${VNAME[d.vlan]||'Infra'})`,d.ip?`IP: ${d.ip}`:'Sin IP en inventario',`Estado: ${STAT_NAME[d.status]||d.status}`];
      if(d.detail)tipLines.push(d.detail);
      const titleEl=el('title',{},tipLines.join('\n'));
      g.insertBefore(titleEl,g.firstChild);
      svg.appendChild(g);
    });
  });

  prPoints.forEach(pr=>{
    const r=getRoom(pr.room);
    if(!r)return;
    const devsInRoom=devices.filter(d=>d.room===pr.room);
    const roomPRs=prPoints.filter(p=>p.room===pr.room);
    const prIdx=roomPRs.indexOf(pr);
    const pos=getPRPos(roomPRs,r,prIdx,devsInRoom.length);
    const cableCol=pr.cable==='Fibra óptica'?'#f59e0b':'#38bdf8';
    const g=el('g');
    
    const ds=11;
    g.appendChild(el('polygon',{points:`${pos.x},${pos.y-ds} ${pos.x+ds},${pos.y} ${pos.x},${pos.y+ds} ${pos.x-ds},${pos.y}`,fill:cableCol,stroke:pr.status==='mantenimiento'?'#eab308':'#556','stroke-width':1.5,opacity:pr.status==='mantenimiento'?.4:.85}));
    g.appendChild(el('text',{x:pos.x,y:pos.y+3.5,'text-anchor':'middle',fill:'#fff','font-size':9,'font-weight':700},pr.id.replace('PR-','P')));
    g.appendChild(el('text',{x:pos.x,y:pos.y+ds+14,'text-anchor':'middle',fill:cableCol,'font-size':9},pr.cable==='Fibra óptica'?'FIBRA':'Cat6'));
    
    const tipLines=[`${pr.id} — ${pr.cable}`,`Área: ${pr.area}`,`Switch: ${pr.sw} Puerto ${pr.port}`,`Estado: ${STAT_NAME[pr.status]||pr.status}`];
    g.insertBefore(el('title',{},tipLines.join('\n')),g.firstChild);
    svg.appendChild(g);
  });

  const aps=devices.filter(d=>d.type==='AP');
  aps.forEach(ap=>{
    const r=getRoom(ap.room);
    const devsInRoom=devices.filter(d=>d.room===ap.room);
    const idx=devsInRoom.indexOf(ap);
    const pos=getDevPos(devsInRoom,r,idx);
    const ssid=ap.detail.includes('Guest')?'NovaPixel-Guest':'NovaPixel-Staff';
    const covR=ap.detail.includes('Guest')?120:90;
    svg.appendChild(el('circle',{cx:pos.x,cy:pos.y,r:covR,fill:VCOL[ap.vlan],opacity:.06,stroke:VCOL[ap.vlan],'stroke-width':1.5,'stroke-dasharray':'6,4'}));
    svg.appendChild(el('text',{x:pos.x,y:pos.y-covR-6,'text-anchor':'middle',fill:VCOL[ap.vlan],'font-size':11,opacity:.6},ssid));
  });

  const cams=devices.filter(d=>d.type==='CM');
  cams.forEach(cam=>{
    const r=getRoom(cam.room);
    const devsInRoom=devices.filter(d=>d.room===cam.room);
    const idx=devsInRoom.indexOf(cam);
    const pos=getDevPos(devsInRoom,r,idx);
    const fovLen=70;
    const fovAngle=35;
    const rad=fovAngle*Math.PI/180;
    const x1=pos.x+fovLen*Math.cos(-rad);
    const y1=pos.y+fovLen*Math.sin(-rad)+16;
    const x2=pos.x+fovLen*Math.cos(rad);
    const y2=pos.y+fovLen*Math.sin(rad)+16;
    const g2=el('g',{opacity:cam.status==='reparacion'?.1:.15});
    g2.appendChild(el('polygon',{points:`${pos.x},${pos.y+12} ${x1},${y1} ${x2},${y2}`,fill:VCOL[60],stroke:VCOL[60],'stroke-width':1}));
    svg.appendChild(g2);
  });

  svg.appendChild(el('rect',{x:0,y:0,width:1840,height:45,fill:'#0f172a'}));
  svg.appendChild(el('text',{x:920,y:28,'text-anchor':'middle',fill:'#38bdf8','font-size':18,'font-weight':700},'NOVAPIXEL — Plano de Distribución de Red sobre Planta'));

  const barY=1460;
  svg.appendChild(el('rect',{x:30,y:barY,width:1780,height:100,rx:8,fill:'#0f172a',stroke:VCOL[0],'stroke-width':2}));
  svg.appendChild(el('text',{x:60,y:barY+24,fill:VCOL[0],'font-size':14,'font-weight':700},'VLANs:'));
  vlans.forEach((v,i)=>{
    const bx=60+i*230;
    svg.appendChild(el('rect',{x:bx,y:barY+35,width:210,height:32,rx:6,fill:VCOL[v.id],opacity:.15,stroke:VCOL[v.id],'stroke-width':1.5}));
    svg.appendChild(el('text',{x:bx+12,y:barY+55,fill:VCOL[v.id],'font-size':13,'font-weight':700},`VLAN ${v.id}`));
    svg.appendChild(el('text',{x:bx+75,y:barY+55,fill:'#e2e8f0','font-size':12},v.name));
    svg.appendChild(el('text',{x:bx+12,y:barY+80,fill:'#94a3b8','font-size':11,'font-family':'monospace'},v.subnet));
    const cnt=devices.filter(d=>d.vlan===v.id).length;
    svg.appendChild(el('text',{x:bx+195,y:barY+55,fill:VCOL[v.id],'font-size':12,'font-weight':600,'text-anchor':'end'},`${cnt} disp.`));
  });
  
  const icnt=devices.filter(d=>d.vlan===0).length;
  svg.appendChild(el('text',{x:1480,y:barY+24,fill:VCOL[0],'font-size':13},`Infra/Gestión: ${icnt} dispositivos | PRs: ${prPoints.length}`));
  svg.appendChild(el('text',{x:30,y:barY+125,fill:'#7b8faa','font-size':11},'⚠ NPS-MON-001 a NPS-MON-016: Monitores sin ubicación definida en inventario — no representados en el plano'));

  svg.appendChild(el('text',{x:1790,y:barY+24,fill:'#7b8faa','font-size':14,'text-anchor':'end','font-weight':700},'N ↑'));
}

function buildLegend(){
  const lg=document.getElementById('legend');
  let h='';
  vlans.forEach(v=>{h+=`<div class="leg"><div class="ldot" style="background:${VCOL[v.id]}"></div>VLAN ${v.id} ${v.name}</div>`;});
  h+=`<div class="leg"><div class="ldot" style="background:${VCOL[0]}"></div>Infra/Gestión</div>`;
  h+='<div style="width:2px;height:24px;background:#334155;margin:0 .5rem"></div>';
  Object.entries(STAT_COL).forEach(([k,v])=>{h+=`<div class="leg"><div class="ldot" style="background:${v};border:2px dashed ${v}"></div>${STAT_NAME[k]}</div>`;});
  h+='<div style="width:2px;height:24px;background:#334155;margin:0 .5rem"></div>';
  h+=`<div class="leg"><div class="ldia" style="background:#38bdf8"></div>Cat6</div>`;
  h+=`<div class="leg"><div class="ldia" style="background:#f59e0b"></div>Fibra óptica</div>`;
  h+='<div style="width:2px;height:24px;background:#334155;margin:0 .5rem"></div>';
  const types=[['RT','Router/FW'],['SW','Switch'],['AP','Access Point'],['SV','Servidor'],['CM','Cámara'],['PR','Impresora'],['PC','Computadora'],['NB','Notebook'],['OT','Otro'],['CA','Ctrl Acceso'],['PJ','Proyector']];
  types.forEach(([k,v])=>{h+=`<div class="leg" style="font-size:0.85rem"><strong>${k}</strong>=${v}</div>`;});
  lg.innerHTML=h;
}

function buildNotes(){
  const n=document.getElementById('notes');
  n.innerHTML=`
  <strong>Notas importantes:</strong><br>
  • <strong>NPS-CAM-006 (Sony FX3)</strong>: Cámara sin IP asignada en inventario (IP: —). Se incluye en VLAN 40 por área (Estudio de Producción Audiovisual).<br>
  • <strong>Control biométrico</strong> y <strong>Tarjeta de acceso</strong>: No poseen ID NPS ni IP en inventario. Responsables: Maximiliano Rojas (Recepción) y Hernán Quiroga (Sala de Servidores).<br>
  • <strong>NPS-MON-001 a NPS-MON-016</strong>: 16 monitores inventariados sin ubicación ni detalle asignado — no se representan en el plano.<br>
  • <strong>PR-013</strong>: Único punto de red en estado EN MANTENIMIENTO (Área de Desarrollo Web, SW-001 Puerto 13).<br>
  • Los cables representados van desde cada PR en su área hasta el switch correspondiente (SW-001 en Sala de Servidores o SW-002 en Área de Diseño).<br>
  • Las líneas punteadas azules = Cat6, amarillas = Fibra óptica.<br>
  • Los círculos translúcidos alrededor de los APs representan la cobertura WiFi estimada.<br>
  • Los conos semitransparentes rojos indican el campo de visión de las cámaras.<br>
  • <strong>Total dispositivos:</strong> ${devices.length} | <strong>Total PRs:</strong> ${prPoints.length} | <strong>Total elementos:</strong> ${devices.length+prPoints.length}<br>
  • Todos los datos provienen exclusivamente del inventario oficial. No se ha inventado ninguna IP, modelo, estado ni conexión.
  `;
}

buildLegend();
buildNotes();
render();
</script>
